name: personal_staffer
description: Private native job discovery and application tracking.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  http: 1.6.0
  crypto: 3.0.7
  uuid: 4.6.0
  drift: 2.35.0
  sqlite3: 3.5.2
  flutter_secure_storage: 11.1.1
  path_provider: 2.1.6
  path: 1.9.1
  url_launcher: 6.3.2
  app_links: 7.2.1
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  flutter_local_notifications: 22.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon_256.png
    - assets/brand/logo.png
