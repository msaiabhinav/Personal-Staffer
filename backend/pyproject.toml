[project]
name = "personal-staffer-backend"
version = "0.1.0"
description = "Evidence-driven private job discovery and application tracking"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx[socks]>=0.28,<1",
  "selectolax>=0.3,<1",
  "celery[redis]>=5.5,<6",
  "authlib>=1.6,<2",
  "cryptography>=44",
  "python-multipart>=0.0.20",
  "email-validator>=2.2,<3",
  "itsdangerous>=2.2,<3",
  "joserfc>=1.7.5",
  "google-auth>=2.40,<3",
]

[dependency-groups]
jobspy = ["python-jobspy==1.1.82"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["postgres: requires real PostgreSQL", "live: explicit network smoke checks"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.uv.dependency-groups]
jobspy = { requires-python = ">=3.12,<3.13" }
